<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#5d4170">
<title>one-surface mock</title>
<link rel="stylesheet" href="./_mock.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="head-in">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="eyebrow">Week 04</p>
      <h1 class="who">Vice President for Finance</h1>
      <p class="dates">September 28 to October 4, 2026</p>
    </div>
  </header>

  <div class="body">
    <p class="count"><b>3</b> tasks left</p>
    <ul class="list">
      <li class="item">
        <button type="button" class="row" aria-pressed="false">
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Reconcile the September petty cash and file the receipts</span>
            <span class="remark">Send the final name to Publication</span>
            <span class="meta">
              <span class="due">Due Monday, September 29, 2026</span>
            </span>
          </span>
        </button>
      </li>
      <li class="item overdue">
        <button type="button" class="row" aria-pressed="false">
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Submit the Q1 budget request to the EBEXECOM</span>
            <span class="meta">
              <span class="tag">Overdue</span>
              <span class="due late">Friday, September 25, 2026</span>
            </span>
          </span>
        </button>
      </li>
      <li class="item">
        <button type="button" class="row" aria-pressed="false">
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Draft the sponsorship deck for the finance week</span>
            <span class="meta">
              <span class="due">Due Saturday, October 3, 2026</span>
              <span class="tag flag">Deadline is not a date</span>
            </span>
          </span>
        </button>
      </li>
      <li class="item done">
        <button type="button" class="row" aria-pressed="true">
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Collect the liquidation forms from the nine committees</span>
            <span class="meta">
              <span class="due">Due Monday, September 28, 2026</span>
            </span>
          </span>
        </button>
        <div class="after">
          <button type="button" class="undo">Undo<span class="secs" aria-hidden="true">45s</span></button>
          <div class="undo-track" aria-hidden="true" style="--undo-left:0.75"><i></i></div>
        </div>
      </li>
      <li class="item done">
        <button type="button" class="row" aria-pressed="true">
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Book the venue deposit</span>
            <span class="meta">
              <span class="due">Due Tuesday, September 22, 2026</span>
            </span>
          </span>
        </button>
        <span class="locked">Ticked off. Ask Ethan to reopen it.</span>
      </li>
      <li class="item busy">
        <button type="button" class="row" aria-pressed="false" disabled>
          <span class="box" aria-hidden="true"></span>
          <span class="text">
            <span class="title">Saving this one right now</span>
            <span class="meta">
              <span class="due">Due Wednesday, September 30, 2026</span>
            </span>
          </span>
        </button>
      </li>
    </ul>
    <footer class="foot">
      <p>Ticking is yours for 60 seconds. After that, ask Ethan to reopen it.</p>
    </footer>
  </div>
</main>

</body>
</html>
