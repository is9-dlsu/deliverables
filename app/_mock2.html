<html lang="en">
<head>

<meta name="theme-color" content="#5d4170">
<title>one-surface mock</title>
<link rel="stylesheet" href="./_mock.css">

<body>
<main class="page">

    <div class="head-in">

      <p class="eyebrow">IS9</p>
      <h1 class="who">Weekly Deliverables</h1>

      <p class="notice-title">This link is not recognised</p>
      <p class="notice-detail">Ask Ethan to send you a new one.</p>

    </div>
